# 部署 NEXUS 到 GitHub Pages
# 觸發：push 到 main，或在 Actions 頁面手動執行（workflow_dispatch）。
# 前提：repo 的 Settings → Pages → Source 選「GitHub Actions」。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署到 Pages 需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一個部署；新的 push 不會中斷正在進行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 網址自動依 repo 決定：https://<帳號>.github.io/<repo>/
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check C++ examples
        run: npm run check:cpp

      - name: Build (type check + build + link check)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
